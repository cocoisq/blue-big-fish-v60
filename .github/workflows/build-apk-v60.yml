name: Build Blue Big Fish V60 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'V60-part-00'
      - 'V60-part-01'
      - '.github/workflows/build-apk-v60.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble project ZIP
        run: |
          cat V60-part-00 V60-part-01 > V60-Android-Project.zip
          unzip -tq V60-Android-Project.zip
          unzip -q V60-Android-Project.zip -d source
          test -f source/TapMaidWidget_Release/settings.gradle.kts

      - name: Build debug APK
        working-directory: source/TapMaidWidget_Release
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-v60-apk
          path: source/TapMaidWidget_Release/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
